[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitsnap-ase-tools"
version = "0.1.0"
description = "Importable utilities for loading FitSNAP JSON datasets into ASE Atoms and ASE-friendly formats."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "ase"]

[project.optional-dependencies]
extras = ["pandas", "json5"]
